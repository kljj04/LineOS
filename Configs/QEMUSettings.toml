# Configs/QEMUSettings.toml
# LineOS Project
# Copyright (C) 2026 LineOS Developer kljj04

[Machine]
Type = "q35"
Acceleration = "kvm"

[CPU]
Model = "host"
Count = 16
Flags = [
    "+tsc-deadline",
    "+invtsc",
    "+rdtscp",
    "+arat",
    "+fsgsbase",
    "+pdpe1gb"
]

[Memory]
Size = "4G"

[Graphics]
Display = "gtk"
Resolution = "2560x1440"
Device = "virtio-gpu-pci"
HostMemory = "1G"

[Network]
Backend = "user"
MAC = "52:54:00:4c:4f:53"

[Input]
Keyboard = "virtio-keyboard-pci"
Mouse = "virtio-tablet-pci"

[RTC]
Base = "utc"
Clock = "host"

[Disk]
Image = "LineOS/LineOS.img"
Size = "8G"
EFISizeMiB = 300

[Debug]
Flags = [
    "int",
    "guest_errors",
    "cpu_reset",
    "unimp"
]
NoReboot = true
NoShutdown = true